name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source
        run: pnpm check && pnpm format:check
      - name: Prerender website
        run: pnpm build
      - name: Deploy production to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-init"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          // One-time initialization with the real Worker bundle. The content endpoint
          // preserves all existing runtime settings and encrypted provider secrets.
          const content = fs.readFileSync(process.env.RUNNER_TEMP + '/worker-init/index.js');
          const body = new FormData();
          body.append('metadata', JSON.stringify({main_module: 'index.js'}));
          body.append('index.js', new Blob([content], {type: 'application/javascript+module'}), 'index.js');
          const endpoint = 'https://api.cloudflare.com/client/v4/accounts/' + process.env.CLOUDFLARE_ACCOUNT_ID + '/workers/scripts/webextreme-dev/content';
          const response = await fetch(endpoint, {method: 'PUT', headers: {Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN}, body});
          console.log('Worker bundle initialization HTTP ' + response.status);
          if (!response.ok) throw new Error('Worker bundle initialization failed.');
          JS
          pnpm exec wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
